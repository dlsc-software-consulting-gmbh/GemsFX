# Texts of the GemsFX showcase application (Norwegian Bokmål). Same texts as showcase_no.properties,
# because Java reports the language of a Norwegian system as "nb" and not as "no".
#
# The PDF manuals and the source code of the demo applications are not localized, only the user
# interface of the showcase itself. Texts passed to MessageFormat must not contain straight
# apostrophes, use the typographic apostrophe instead.

